<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille marchés</title>
<style>
  :root{
    --bg:#0a0e16; --panel:#111725; --panel2:#161d2d; --line:#232c40;
    --ink:#e7ecf5; --dim:#8794ad; --faint:#5b6780;
    --pos:#3fbf7f; --neg:#e0555f; --warn:#e0a33f; --accent:#f26522;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

  /* ---------- en-tete ---------- */
  header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
  .brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:20px;letter-spacing:-.01em;font-weight:650}
  h1 .tick{color:var(--accent)}
  .refdate{font-family:var(--mono);font-size:13px;color:var(--dim)}
  .meta{margin-top:8px;font-size:12.5px;color:var(--faint);
        display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .diag{font-family:var(--mono)}
  .diag b{font-weight:600}
  .diag .k-ok{color:var(--pos)} .diag .k-warn{color:var(--warn)} .diag .k-err{color:var(--neg)}
  button{font:inherit;color:var(--ink);background:var(--panel2);
         border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
  button:hover{border-color:var(--faint)}
  button:disabled{opacity:.5;cursor:default}
  .meta a{color:#7fb4ea;text-decoration:none;font-size:12.5px}
  .meta a:hover{text-decoration:underline}
  .meta .k-warn{color:var(--warn);font-weight:600}

  /* ---------- groupes ---------- */
  section{margin-bottom:30px}
  .ghead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .ghead h2{margin:0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
            color:var(--dim);font-weight:650}
  .ghead .rule{flex:1;height:1px;background:var(--line)}

  /* ---------- tableau ----------
     Un tableau plutot que des tuiles : pour quinze lignes, des cartes gaspillent
     la hauteur et font passer la variation a la ligne. Colonnes alignees, une
     ligne par indicateur, lisible d'un coup d'oeil. */
  /* Une seule taille de police pour toutes les colonnes : le ticker, le nom, le
     cours et la variation se lisent sur la meme ligne de base. Seule la famille
     change — monospace sur les colonnes numeriques pour que les chiffres
     s'alignent verticalement. */
  table.board{width:100%;border-collapse:collapse;font-size:13px}
  table.board td{padding:5px 8px;border-bottom:1px solid #1a2132;white-space:nowrap;
                 font-size:inherit}
  table.board tr:last-child td{border-bottom:none}
  table.board tr:hover td{background:#151c2b}
  /* Meme couleur que le nom : le ticker n'est pas une alerte. La police
     monospace suffit a distinguer la colonne. */
  .c-tick{font-family:var(--mono);color:#c3cde0;font-weight:600;width:1%}
  .c-name{color:#c3cde0;font-weight:550;white-space:normal}
  .c-ccy{font-family:var(--mono);color:var(--faint);width:1%}
  .c-lvl{font-family:var(--mono);text-align:right;
         font-variant-numeric:tabular-nums;width:1%}
  .c-chg{font-family:var(--mono);text-align:right;font-weight:600;
         font-variant-numeric:tabular-nums;width:1%;padding-right:12px}
  .c-date{font-family:var(--mono);color:var(--faint);
          font-variant-numeric:tabular-nums;text-align:right;width:1%}
  thead th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;
           color:var(--faint);font-weight:600;text-align:left;
           padding:0 8px 5px;border-bottom:1px solid var(--line)}
  thead th.r{text-align:right}
  .tri{font-size:8.5px;margin-right:3px;vertical-align:1px;font-family:var(--sans)}
  .up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--dim)}
  .stale-date{color:var(--warn)}
  .bad td{color:var(--neg)}

  @media (max-width:560px){
    table.board{font-size:12px}
    .c-date{display:none}          /* la date passe en infobulle sur mobile */
  }

  .badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:1.5px 5px;
         border-radius:4px;text-transform:uppercase;white-space:nowrap;font-weight:600}
  .b-stale{background:#3a2c12;color:var(--warn)}
  .b-susp{background:#3d1c22;color:var(--neg)}
  .b-pct{background:#1b2c44;color:#7fb4ea}
  .b-lag{background:#2b2f3d;color:#a3b0c9}
  .badge{margin-left:5px;vertical-align:1px}

  /* ---------- brief ---------- */
  .news{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px}
  /* Un seul corps de texte dans tout le brief — focus et puces a la meme taille.
     Seuls les intitules de rubrique et la ligne de sources s'en distinguent. */
  .news{font-size:13.5px}
  .focus{padding-bottom:15px;border-bottom:1px solid var(--line)}
  .focus h3{margin:0 0 6px;font-size:13.5px;color:#fff;font-weight:650}
  .focus p{margin:0;line-height:1.6;color:#dbe3f0}
  .zone{margin-top:18px}
  .zone h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
           color:var(--accent);font-weight:650}
  .bul{margin:0;padding-left:17px;list-style:none}
  .bul li{position:relative;margin-bottom:9px;line-height:1.6;color:#c9d3e4}
  .bul li::before{content:"▪";position:absolute;left:-15px;color:var(--faint)}
  .srcs{margin-top:8px;font-size:11.5px;color:var(--faint);font-family:var(--mono)}
  .srcs a{color:#7fb4ea;text-decoration:none}
  .srcs a:hover{text-decoration:underline}

  .ctrl{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search],select{font:inherit;font-size:13.5px;color:var(--ink);
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
  input[type=search]{min-width:220px}

  .empty{color:var(--faint);font-size:13.5px;font-style:italic}
  .err{background:#2a151a;border:1px solid #5a2730;color:#f0b4ba;
       border-radius:8px;padding:13px 15px;font-size:13.5px}
  .note{background:#1a1f2e;border:1px solid var(--line);color:var(--dim);
        border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:22px}
  .note b{color:#c3cde0;font-weight:550}
  .note .badge{vertical-align:1px}
  .err code{font-family:var(--mono);font-size:12.5px;color:#fff}
  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
         font-size:11.5px;color:var(--faint);line-height:1.8}
  footer b{color:var(--dim)}
  footer .badge{margin:0 2px}

  @media print{
    body{background:#fff;color:#000}
    .news{border-color:#bbb;background:#fff;break-inside:avoid}
    .c-name,.focus h3,.focus p{color:#000}
    .bul li{color:#222}
    table.board td{border-bottom-color:#ddd}
    table.board tr:hover td{background:none}
    .c-tick{color:#333} .c-ccy,.c-date,footer{color:#666}
    section{break-inside:avoid}
    button,.ctrl,.meta a{display:none}
    .up{color:#0a6b3d} .down{color:#a01722}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1><span class="tick">▍</span> Veille marchés</h1>
      <span class="refdate" id="refdate">chargement…</span>
    </div>
    <div class="meta">
      <span class="diag" id="diag"></span>
      <span id="gen"></span>
      <button id="refresh">Rafraîchir</button>
      <button id="print">Imprimer</button>
      <a id="runlink" href="#" target="_blank" rel="noopener" hidden>Lancer un relevé ↗</a>
    </div>
  </header>

  <div id="alert"></div>
  <div id="board"></div>

  <section>
    <div class="ghead"><h2>Brief du jour</h2><span id="briefdate" class="refdate"></span><div class="rule"></div></div>
    <div class="ctrl">
      <select id="pickdate"><option>—</option></select>
      <input type="search" id="q" placeholder="Rechercher dans tout l'historique…">
    </div>
    <div class="news" id="news"><span class="empty">chargement…</span></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
"use strict";

/* Lecture same-origin : le site est servi par GitHub Pages depuis le depot qui
   contient latest.json. Aucun CORS, aucune URL a configurer. Le parametre
   anti-cache reste utile car Pages met en cache quelques minutes. */
const bust = () => "?t=" + Date.now();
const getJSON = async (p) => {
  const r = await fetch(p + bust(), {cache: "no-store"});
  if (!r.ok) throw new Error(p + " → HTTP " + r.status);
  return r.json();
};

/* Regroupement d'affichage. Par famille et non par zone : on lit une bande
   marches par nature d'actif, alors que le brief presse se lit par zone. */
const GROUPS = [
  ["Actions",     ["S&P 500","Nasdaq 100","CAC 40","Euro Stoxx 50","Nikkei 225",
                   "Shanghai Comp.","KOSPI"]],
  ["Change",      ["EUR/USD"]],
  ["Taux",        ["10Y US","10Y France"]],
  ["Volatilité & sentiment", ["VIX","Fear & Greed crypto"]],
  ["Matières & crypto", ["Or","Brent","Bitcoin"]],
];

/* Convention francaise : les points de base s'ecrivent « pb ». */
const UNIT_SUFFIX = {pct:" %", bp:" pb", pts:" pt"};
const nf = (v, d) => v.toLocaleString("fr-FR",
  {minimumFractionDigits:d, maximumFractionDigits:d});

const cls = (v) => v == null ? "flat" : (v > 0 ? "up" : (v < 0 ? "down" : "flat"));

/* Le triangle porte le sens de la variation, donc le +/− devient redondant :
   on n'affiche que la magnitude. */
const ARROW = {up:"▲", down:"▼", flat:"–"};
function signed(v, unit){
  const d = unit === "pct" ? 2 : (unit === "bp" ? 1 : 2);
  return `<span class="tri">${ARROW[cls(v)]}</span>`
       + nf(Math.abs(v), d) + (UNIT_SUFFIX[unit] || "");
}
const frDate = (iso) => {
  const [y,m,d] = iso.split("-");
  return d + "/" + m + "/" + y;
};

function row(label, e){
  if (!e || e.error){
    return `<tr class="bad"><td class="c-tick">—</td><td class="c-name">${label}</td>
      <td class="c-ccy"></td><td class="c-lvl">indisponible</td>
      <td class="c-chg"></td><td class="c-date"></td></tr>`;
  }
  const unit = e.unit || "pct", chg = e.change;

  const badges = [];
  if (e.stale)   badges.push(`<span class="badge b-stale" title="${e.stale_reason||""}">périmé</span>`);
  if (e.suspect) badges.push(`<span class="badge b-susp" title="${e.suspect_reason||""}">suspect</span>`);

  /* Date du dernier cours, en ambre si elle n'est pas à jour. Sans elle, un
     chiffre de la semaine dernière se lit comme celui d'hier. */
  let date;
  if (e.on_target === null){
    /* Une moyenne mensuelle n'a pas de jour : afficher 01/06/2026 laisserait
       croire a une cotation du 1er juin. */
    const [yy, mm] = e.date.split("-");
    date = `<span class="stale-date" title="moyenne mensuelle">${mm}/${yy}</span>`;
  } else {
    const cls2 = e.on_target === false ? ' class="stale-date"' : "";
    date = `<span${cls2}>${frDate(e.date)}</span>`;
  }
  if ((e.change_days || 0) > 4 && e.on_target !== null)
    date = `<span class="stale-date" title="variation calculée depuis le ${e.change_from}">${frDate(e.date)} ⚠</span>`;

  /* Nature de la valeur, source et devise en infobulle : disponible sans
     encombrer la ligne. */
  const tip = [e.basis, e.source].filter(Boolean).join(" · ");

  return `<tr title="${tip}">
    <td class="c-tick">${e.ticker || "—"}</td>
    <td class="c-name">${label} ${badges.join("")}</td>
    <td class="c-ccy">${e.ccy || ""}</td>
    <td class="c-lvl">${nf(e.level, e.dec ?? 2)}</td>
    <td class="c-chg ${cls(chg)}">${chg != null ? signed(chg, unit) : "—"}</td>
    <td class="c-date">${date}</td>
  </tr>`;
}

function renderBoard(data){
  const m = data.markets || {};
  const d = data.diagnostics || {};
  const target = d.target_date || data.target_date || data.date;

  document.getElementById("refdate").textContent =
    "séance du " + new Date(target + "T00:00:00").toLocaleDateString("fr-FR",
      {weekday:"long", day:"numeric", month:"long", year:"numeric"});

  const bits = [`<b class="k-ok">${(d.aligned||[]).length}</b> sur la séance`];
  const off = d.off_target || [];
  if (off.length)
    bits.push(`<b class="k-warn">${off.length}</b> en retard de publication`);
  if ((d.errors||[]).length)  bits.push(`<b class="k-err">${d.errors.length}</b> erreurs`);
  if ((d.stale||[]).length)   bits.push(`<b class="k-warn">${d.stale.length}</b> périmés`);
  if ((d.suspect||[]).length) bits.push(`<b class="k-warn">${d.suspect.length}</b> suspects`);
  document.getElementById("diag").innerHTML = bits.join("  ·  ");

  /* Les instruments en retard sont nommés en clair. Aucune source gratuite ne
     publie leur séance du jour cible ; les masquer laisserait croire que tout
     le tableau porte la même date. */
  if (off.length){
    document.getElementById("alert").innerHTML = `<div class="note">
      Pas encore publiés pour le ${frDate(target)} — affichés à leur date réelle,
      repérables par le badge <span class="badge b-lag">J−n</span> :
      <b>${off.map(o => o[0]).join(", ")}</b>.</div>`;
  }

  /* L'âge de la donnée compte plus que l'heure du relevé : c'est lui qui dit si
     le pipeline a tourné ce matin ou s'il est en panne depuis trois jours. */
  if (data.generated_at){
    const gen = new Date(data.generated_at);
    const hours = (Date.now() - gen) / 36e5;
    const age = hours < 1 ? "à l'instant"
              : hours < 24 ? `il y a ${Math.round(hours)} h`
              : `il y a ${Math.round(hours / 24)} j`;
    const el = document.getElementById("gen");
    el.textContent = "relevé " + age;
    el.title = gen.toLocaleString("fr-FR");
    /* Au-delà de 36 h un jour ouvré, le pipeline n'a pas tourné comme prévu. */
    el.className = hours > 36 ? "k-warn" : "";
  }

  const HEAD = `<thead><tr><th>Ticker</th><th>Nom</th><th>Dev.</th>
    <th class="r">Cours</th><th class="r">Var.</th><th class="r">Date</th></tr></thead>`;

  const seen = new Set();
  let html = "";
  for (const [title, labels] of GROUPS){
    const rows = labels.filter(l => l in m).map(l => (seen.add(l), row(l, m[l]))).join("");
    if (rows) html += `<section><div class="ghead"><h2>${title}</h2><div class="rule"></div></div>
      <table class="board">${HEAD}<tbody>${rows}</tbody></table></section>`;
  }
  const rest = Object.keys(m).filter(l => !seen.has(l));
  if (rest.length) html += `<section><div class="ghead"><h2>Autres</h2><div class="rule"></div></div>
    <table class="board">${HEAD}<tbody>${rest.map(l => row(l, m[l])).join("")}</tbody></table></section>`;

  document.getElementById("board").innerHTML = html;

  const notes = Object.entries(m).filter(([,e]) => e && e.note)
    .map(([l,e]) => `${l} — ${e.note}`);
  document.getElementById("foot").innerHTML =
    `<b>Légende</b> — <span class="badge b-stale">périmé</span> la source n'a pas publié depuis
     plusieurs jours. <span class="badge b-susp">suspect</span> variation hors
     bornes de plausibilité, ou sources divergentes. Date en ambre : le cours n'est
     pas celui de la dernière séance close. Survoler une ligne donne la nature
     exacte de la valeur et sa source.
     <br><br>
     Sources : Réserve fédérale de St. Louis (FRED), Banque centrale européenne,
     Banque de France, Kraken, alternative.me, Yahoo Finance. Relevé automatique
     en jours ouvrés à 5h00 UTC.
     ${notes.length ? "<br><br>" + notes.join("<br>") : ""}`;
}

/* ---------------------------------------------------------------- brief ---- */

/* Ordre repris du weekly interne : focus, puis macro, géopolitique, micro,
   actions, obligataire. L'ordre compte — c'est celui dans lequel le lecteur
   s'attend à trouver l'information. Les clés sont ordonnées, le rendu suit. */
const SECTIONS = {
  macro:       "Contexte macroéconomique",
  geo:         "Géopolitique",
  micro:       "Contexte microéconomique",
  actions:     "Marchés actions",
  obligations: "Marchés obligataires",
};
let briefCache = {};   // date -> brief
let briefIndex = [];

/* Rend un brief en chaine HTML. Separer la construction de l'ecriture dans le
   DOM permet a la recherche de concatener plusieurs briefs sans manipulation
   d'elements temporaires. */
function briefHTML(brief, highlight){
  if (!brief) return `<span class="empty">Aucun brief pour cette date.</span>`;

  const mark = (t) => {
    if (!highlight || !t) return t || "";
    const safe = highlight.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return t.replace(new RegExp("(" + safe + ")", "gi"),
      '<mark style="background:#3d3416;color:#f0d78a">$1</mark>');
  };

  /* Le focus ouvre le brief : un seul sujet, celui qui a dominé la séance. */
  let html = "";
  if (brief.focus && brief.focus.body){
    html += `<div class="focus">
      ${brief.focus.title ? `<h3>Le focus du jour — ${mark(brief.focus.title)}</h3>` : ""}
      <p>${mark(brief.focus.body)}</p></div>`;
  }

  /* Puces sans titre, comme dans le weekly : un paragraphe court par fait,
     suivi de sa source cliquable. */
  for (const [key, title] of Object.entries(SECTIONS)){
    const items = (brief.sections && brief.sections[key]) || [];
    if (!items.length) continue;
    /* Les liens sont regroupes sous la rubrique plutot qu'accroches a chaque
       puce : le texte reste lisible d'un trait, et les sources sont dedoublonnees. */
    const seenSrc = new Map();
    for (const it of items) if (it.url && !seenSrc.has(it.url))
      seenSrc.set(it.url, it.source || "source");
    const srcLine = seenSrc.size
      ? `<div class="srcs">Sources : ` + [...seenSrc].map(([u, n]) =>
          `<a href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join(" · ") + `</div>`
      : "";

    html += `<div class="zone"><h3>${title}</h3><ul class="bul">`
      + items.map(it => `<li>${mark(it.text)}</li>`).join("")
      + `</ul>${srcLine}</div>`;
  }
  return html || `<span class="empty">Brief vide.</span>`;
}

function renderBrief(brief, highlight){
  document.getElementById("news").innerHTML = briefHTML(brief, highlight);
}

async function loadBrief(date){
  if (briefCache[date]) return briefCache[date];
  try{
    const b = await getJSON(`news/brief-${date}.json`);
    briefCache[date] = b;
    return b;
  }catch{ return null; }
}

async function initBrief(){
  try{ briefIndex = (await getJSON("news/index.json")).dates || []; }
  catch{ briefIndex = []; }

  const sel = document.getElementById("pickdate");
  if (!briefIndex.length){
    sel.innerHTML = `<option>aucun brief</option>`;
    document.getElementById("news").innerHTML =
      `<span class="empty">Aucun brief publié pour l'instant. La tâche planifiée
       écrira news/brief-AAAA-MM-JJ.json et news/index.json.</span>`;
    return;
  }
  sel.innerHTML = briefIndex.map(d => `<option value="${d}">${d}</option>`).join("");
  renderBrief(await loadBrief(briefIndex[0]));
  sel.onchange = async () => renderBrief(await loadBrief(sel.value));
}

/* Recherche plein texte : charge les briefs a la demande et les garde en cache. */
async function search(term){
  if (!term){ renderBrief(await loadBrief(document.getElementById("pickdate").value)); return; }
  const hits = [];
  for (const d of briefIndex){
    const b = await loadBrief(d);
    if (!b) continue;
    const q = term.toLowerCase();
    if (!JSON.stringify(b).toLowerCase().includes(q)) continue;

    /* Ne garde que les puces qui contiennent le terme, et le focus s'il le
       contient : afficher le brief entier noierait le résultat. */
    const sections = {};
    for (const [key, items] of Object.entries(b.sections || {})){
      const keep = (items || []).filter(it => (it.text || "").toLowerCase().includes(q));
      if (keep.length) sections[key] = keep;
    }
    const focus = (b.focus && ((b.focus.title || "") + (b.focus.body || ""))
                    .toLowerCase().includes(q)) ? b.focus : null;
    if (focus || Object.keys(sections).length)
      hits.push({date: d, focus, sections});
  }
  const el = document.getElementById("news");
  if (!hits.length){
    el.innerHTML = `<span class="empty">Aucun résultat pour « ${term} ».</span>`;
    return;
  }
  el.innerHTML = hits.map(h => `
    <div style="margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)">
      <div style="font-family:var(--mono);font-size:11.5px;color:var(--accent);
                  margin-bottom:6px">${h.date}</div>
      ${briefHTML(h, term)}
    </div>`).join("");
}

/* ------------------------------------------------------------------ init --- */

/* Relit latest.json et le brief sans recharger la page. Le bouton ne relance PAS
   le pipeline : une page statique ne peut pas déclencher un workflow GitHub sans
   y embarquer un jeton, ce qui est exclu sur un dépôt public. Pour forcer un
   relevé, passer par Actions → Run workflow (lien « Lancer un relevé »). */
async function load(){
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "…";
  document.getElementById("alert").innerHTML = "";
  try{
    renderBoard(await getJSON("latest.json"));
  }catch(err){
    document.getElementById("refdate").textContent = "";
    document.getElementById("alert").innerHTML = `<div class="err">
      <b>Impossible de lire latest.json.</b><br>
      ${err.message}<br><br>
      Causes probables : le workflow n'a jamais tourné, ou GitHub Pages n'est pas
      encore activé sur la branche. Vérifier que <code>latest.json</code> existe
      bien à la racine du dépôt — un <code>git add history/</code> seul ne le
      pousse pas.</div>`;
  }
  briefCache = {};                     // vide le cache pour relire les briefs
  await initBrief();
  btn.disabled = false; btn.textContent = "Rafraîchir";
}

(async function(){
  document.getElementById("print").onclick = () => window.print();
  document.getElementById("refresh").onclick = () => load();

  /* Déduit l'URL du dépôt depuis l'adresse GitHub Pages : compte.github.io/depot
     donne github.com/compte/depot/actions. Absent en local, donc masqué. */
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (m){
    const repo = location.pathname.split("/").filter(Boolean)[0];
    if (repo){
      const a = document.getElementById("runlink");
      a.href = `https://github.com/${m[1]}/${repo}/actions`;
      a.hidden = false;
    }
  }

  await load();

  let timer;
  document.getElementById("q").addEventListener("input", (ev) => {
    clearTimeout(timer);
    const v = ev.target.value.trim();
    timer = setTimeout(() => search(v), 280);
  });
})();
</script>
</body>
</html>
