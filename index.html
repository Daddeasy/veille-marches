<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille marchés</title>
<style>
  /* ================= palette =================
     Toute couleur de la page passe par un jeton ci-dessous. La regle vaut sans
     exception : une teinte ecrite en dur dans une regle ne suit pas le theme, et
     la page s'eclaircit alors a moitie — pire que de rester sombre.

     Chaque jeton porte ses deux valeurs par light-dark(clair, sombre), resolues
     selon le color-scheme effectif. Un seul point de bascule en consequence, en
     bas de ce bloc, au lieu d'une palette dupliquee que l'on oublie de tenir a
     jour des deux cotes.

     Les teintes viennent de la charte : marine profond et indigo pour les fonds
     sombres, lavande grisee et creme pour les fonds clairs, orange en accent.

     Trois jetons echappent a la charte, et c'est deliberé : --pos, --neg et --warn
     portent du sens, pas du style. Un signe de baisse doit se lire sans hesitation.
     Le cramoisi de la charte sert donc de --neg en theme clair, mais l'orange de
     l'accent ne peut pas servir de --warn : les deux se confondraient. --warn est
     tire vers le jaune pour rester distinct de l'accent a cote duquel il tombe. */
  :root{
    color-scheme: light dark;

    /* fonds et separateurs */
    --bg:      light-dark(#faf8f4, #0b0a24);   /* creme tres pale / marine profond */
    --panel:   light-dark(#ffffff, #14133a);
    --panel2:  light-dark(#f3f1f7, #1c1b47);   /* indigo pour les encarts */
    --line:    light-dark(#ded9e6, #2e2c5c);
    --line2:   light-dark(#ebe7f1, #232149);   /* filets internes, plus discrets */
    --hover:   light-dark(#f6f4f9, #1a1942);

    /* texte, du plus appuye au plus effaced */
    --ink:     light-dark(#191735, #edebf5);
    --ink2:    light-dark(#3a3760, #ccc9e2);   /* corps de texte du brief */
    --dim:     light-dark(#56537a, #a5a2c0);
    --faint:   light-dark(#6a6785, #8d8aab);   /* petit texte : 4,8:1 minimum */

    /* Signaux — hors charte, voir ci-dessus. Valeurs choisies au contraste mesure
       sur les deux fonds, jamais a l'oeil : --accent en clair valait 3,82:1 sur du
       texte de 11,5 px, sous le seuil lisible.
       --warn est tire vers l'or plutot que vers l'ambre : a 13 degres de teinte de
       l'orange de l'accent les deux se confondaient, on est passe a 22-27. */
    /* Hausse et baisse, francs : ce sont les deux couleurs qu'on cherche du regard
       dans le tableau, elles doivent sauter aux yeux. Pousses au maximum de
       saturation compatible avec 4,5:1 — en clair, 100 % de saturation tous les
       deux ; en sombre, le fond marine autorise le quasi neon. Un cran plus vif
       (#e6002e, #00914a) et le contraste tombe sous le seuil lisible. */
    --pos:     light-dark(#00803c, #00f5a0);
    --neg:     light-dark(#dc002a, #ff2d55);
    --warn:    light-dark(#6d5e05, #dbc855);
    --accent:  light-dark(#b84a00, #fa7b05);   /* orange de la charte */
    --link:    light-dark(#403c8f, #a8a5e8);   /* indigo / lavande */

    /* Une couleur par rubrique, pour que l'oeil retrouve une famille sans lire son
       intitule. Teintes reparties sur la roue de la charte et non prises au hasard :
       les six sont a 33 degres au moins l'une de l'autre, sinon macro et obligataire
       se lisaient comme la meme famille. Toutes verifiees a 4,5:1 minimum sur le
       panneau, dans les deux themes — ce sont des titres de 11,5 px. */
    --s-macro:  light-dark(#3b3a8c, #9b98e8);   /* indigo */
    --s-geo:    light-dark(#a8102f, #ff8fa0);   /* cramoisi et rose de la charte */
    --s-micro:  light-dark(#2f6b52, #8fc9ae);   /* sauge */
    --s-actions:light-dark(#b84a00, #fa7b05);   /* orange */
    --s-oblig:  light-dark(#175f70, #7fc6d8);   /* bleu ardoise */
    --s-cal:    light-dark(#76409e, #c9a3e8);   /* lavande */

    /* pastilles et blocs de message */
    --warn-bg: light-dark(#fbf0d2, #34310f);   /* accorde a l'or de --warn */
    --neg-bg:  light-dark(#fbdfe4, #3d1c22);
    --info-bg: light-dark(#e7e5f6, #24234f);
    --info-fg: light-dark(#403c8f, #a8a5e8);
    --mute-bg: light-dark(#eae7ef, #2b2f3d);
    --mute-fg: light-dark(#56537a, #a3b0c9);
    --err-bg:  light-dark(#fdeef1, #2a151a);
    --err-line:light-dark(#eec0c9, #5a2730);
    --err-ink: light-dark(#8c0022, #f0b4ba);
    --note-bg: light-dark(#f4f2f7, #1a1f2e);
    --mark-bg: light-dark(#fde7c4, #3d3416);
    --mark-ink:light-dark(#5a4300, #f0d78a);

    --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  /* Le seul point de bascule. Sans attribut, le systeme decide. */
  :root[data-theme="light"]{ color-scheme: light }
  :root[data-theme="dark"] { color-scheme: dark  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

  /* ---------- en-tete ---------- */
  header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
  .brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:20px;letter-spacing:-.01em;font-weight:650}
  h1 .tick{color:var(--accent)}
  .refdate{font-family:var(--mono);font-size:13px;color:var(--dim)}
  .meta{margin-top:8px;font-size:12.5px;color:var(--faint);
        display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .diag{font-family:var(--mono)}
  .diag b{font-weight:600}
  .diag .k-ok{color:var(--pos)} .diag .k-warn{color:var(--warn)} .diag .k-err{color:var(--neg)}
  button{font:inherit;color:var(--ink);background:var(--panel2);
         border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
  button:hover{border-color:var(--faint)}
  button:disabled{opacity:.5;cursor:default}
  .meta a{color:var(--link);text-decoration:none;font-size:12.5px}
  .meta a:hover{text-decoration:underline}
  .meta .k-warn{color:var(--warn);font-weight:600}

  /* ---------- groupes ---------- */
  section{margin-bottom:30px}
  .ghead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .ghead h2{margin:0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
            color:var(--dim);font-weight:650}
  .ghead .rule{flex:1;height:1px;background:var(--line)}

  /* ---------- tableau ----------
     Un tableau plutot que des tuiles : pour quinze lignes, des cartes gaspillent
     la hauteur et font passer la variation a la ligne. Colonnes alignees, une
     ligne par indicateur, lisible d'un coup d'oeil. */
  /* Une seule taille de police pour toutes les colonnes : le ticker, le nom, le
     cours et la variation se lisent sur la meme ligne de base. Seule la famille
     change — monospace sur les colonnes numeriques pour que les chiffres
     s'alignent verticalement. */
  table.board{width:100%;border-collapse:collapse;font-size:13px}
  table.board td{padding:5px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;
                 font-size:inherit}
  table.board tr:last-child td{border-bottom:none}
  table.board tr:hover td{background:var(--hover)}
  /* Meme couleur que le nom : le ticker n'est pas une alerte. La police
     monospace suffit a distinguer la colonne. */
  .c-tick{font-family:var(--mono);color:var(--ink2);font-weight:600;width:1%}
  .c-name{color:var(--ink2);font-weight:550;white-space:normal}
  .c-ccy{font-family:var(--mono);color:var(--faint);width:1%}
  .c-lvl{font-family:var(--mono);text-align:right;
         font-variant-numeric:tabular-nums;width:1%}
  .c-chg{font-family:var(--mono);text-align:right;font-weight:600;
         font-variant-numeric:tabular-nums;width:1%;padding-right:12px}
  .c-date{font-family:var(--mono);color:var(--faint);
          font-variant-numeric:tabular-nums;text-align:right;width:1%}
  thead th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;
           color:var(--faint);font-weight:600;text-align:left;
           padding:0 8px 5px;border-bottom:1px solid var(--line)}
  thead th.r{text-align:right}
  .tri{font-size:8.5px;margin-right:3px;vertical-align:1px;font-family:var(--sans)}
  .up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--dim)}
  .stale-date{color:var(--warn)}
  .bad td{color:var(--neg)}

  @media (max-width:560px){
    table.board{font-size:12px}
    .c-date{display:none}          /* la date passe en infobulle sur mobile */
  }

  .badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:1.5px 5px;
         border-radius:4px;text-transform:uppercase;white-space:nowrap;font-weight:600}
  .b-stale{background:var(--warn-bg);color:var(--warn)}
  .b-susp{background:var(--neg-bg);color:var(--neg)}
  .b-pct{background:var(--info-bg);color:var(--info-fg)}
  .b-lag{background:var(--mute-bg);color:var(--mute-fg)}
  .badge{margin-left:5px;vertical-align:1px}

  /* ---------- brief ---------- */
  .news{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px}
  /* Un seul corps de texte dans tout le brief — focus et puces a la meme taille.
     Seuls les intitules de rubrique et la ligne de sources s'en distinguent. */
  .news{font-size:13.5px}
  .focus{padding-bottom:15px;border-bottom:1px solid var(--line)}
  .focus h3{margin:0 0 6px;font-size:13.5px;color:var(--ink);font-weight:650}
  .focus p{margin:0;line-height:1.6;color:var(--ink2)}
  .zone{margin-top:18px}
  .zone h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
           color:var(--accent);font-weight:650}
  .z-macro       h3{color:var(--s-macro)}
  .z-geo         h3{color:var(--s-geo)}
  .z-micro       h3{color:var(--s-micro)}
  .z-actions     h3{color:var(--s-actions)}
  .z-obligations h3{color:var(--s-oblig)}
  .z-calendrier  h3{color:var(--s-cal)}
  /* Un filet de la couleur de la rubrique sous son intitule : la teinte se lit
     mieux sur un trait plein que sur six lettres capitales fines. */
  .zone h3::after{content:"";display:block;width:26px;height:2px;margin-top:5px;
                  background:currentColor;border-radius:1px;opacity:.75}
  .bul{margin:0;padding-left:17px;list-style:none}
  .bul li{position:relative;margin-bottom:9px;line-height:1.6;color:var(--ink2)}
  .bul li::before{content:"▪";position:absolute;left:-15px;color:var(--faint)}
  .srcs{margin-top:8px;font-size:11.5px;color:var(--faint);font-family:var(--mono)}
  .srcs a{color:var(--link);text-decoration:none}
  .srcs a:hover{text-decoration:underline}

  /* ---------- encart FactSet, en tete de la rubrique micro ----------
     Publication hebdomadaire du vendredi, reprise a l'identique toute la semaine :
     le fond decale du panneau signale au premier regard que ce bloc ne porte pas
     sur la seance, et la date « au JJ/MM/AAAA » dit de quel jour il parle. */
  .fs{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
      padding:10px 12px;margin-bottom:11px}
  /* Aucune police ni taille propre : tout l'encart herite du corps de texte du
     brief. Un titre en petite capitale et une date en monospace en faisaient un
     bloc etranger, la ou c'est le meme texte lu de la meme facon. Seuls la
     graisse et la couleur distinguent l'intitule de sa date. */
  .fs-head{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:7px}
  .fs-name{color:var(--ink);font-weight:650}
  .fs-as,.fs-q{color:var(--dim)}
  /* Declaree apres .stale-date, donc gagnante a specificite egale : il faut deux
     classes pour que l'ambre du retard reprenne la main sur le gris. */
  .fs-as.stale-date{color:var(--warn)}
  .fs-head a{color:var(--link);text-decoration:none;margin-left:auto}
  .fs-head a:hover{text-decoration:underline}
  /* Puces, et non colonnes : le rapport presente ses Key Metrics en phrases
     entieres introduites par un intitule, et un decoupage en libelle / chiffre /
     contexte cassait ces phrases sans rien gagner en lisibilite. Meme forme que
     les puces du brief, a l'intitule en gras pres. */
  /* ---------- calendrier prospectif ----------
     Un jour par ligne, l'intitule du jour a gauche. Les jours passes de la semaine
     sont estompes plutot que retires : le lecteur du jeudi veut voir que la Fed est
     derriere lui, pas la chercher. Le jour courant est marque. */
  /* Un tableau et non des paragraphes. Sur treize rendez-vous le meme jeudi, une
     ligne courante melait heure, zone, libelle, attendu et precedent sans qu'aucun
     ne s'aligne d'une ligne a l'autre : illisible des qu'on cherche un chiffre.
     Colonnes alignees sur toute la semaine, comme la bande d'indicateurs en haut
     de page — c'est la meme lecture, on parcourt une colonne du regard.

     La colonne « publie » reste vide tant que le chiffre n'est pas sorti et se
     remplit au fil de la semaine. C'est ce qui fait passer le bloc d'annonce a
     recapitulatif sans qu'une ligne bouge. */
  table.cal{width:100%;border-collapse:collapse;font-size:13px;margin-top:2px}
  table.cal td{padding:5px 8px;border-bottom:1px solid var(--line2);
               vertical-align:baseline}
  table.cal tr:last-child td{border-bottom:none}
  table.cal tbody tr:hover td{background:var(--hover)}
  table.cal thead th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;
                     color:var(--faint);font-weight:600;text-align:left;
                     padding:0 8px 5px;border-bottom:1px solid var(--line)}
  table.cal thead th.r{text-align:right}

  /* Intitule de journee : une ligne pleine largeur, qui sert de repere sans
     rompre l'alignement des colonnes. */
  .k-jour td{padding-top:11px;color:var(--dim);font-weight:650;
             border-bottom:1px solid var(--line)}
  .k-jour:first-child td{padding-top:2px}
  /* L'accent marque l'intitule du jour, pas ses lignes : sans les deux classes,
     .k-today td l'emporte sur .k-ev et repeint toute la journee en orange. */
  .k-jour.k-today td{color:var(--accent)}
  .k-past td{opacity:.5}

  .k-h{font-family:var(--mono);color:var(--faint);width:1%;white-space:nowrap;
       font-variant-numeric:tabular-nums}
  .k-z{font-family:var(--mono);color:var(--dim);font-weight:600;width:1%;
       white-space:nowrap}
  .k-flag{width:16px;height:11px;vertical-align:-1px;margin-right:5px;
          border-radius:1px}
  .k-ev{color:var(--ink2)}
  /* Meme taille que le reste du tableau : seule la couleur met la precision en
     retrait. Le principe vaut deja pour la bande d'indicateurs — une seule taille
     de police, la famille et la teinte suffisent a hierarchiser. */
  .k-det{display:block;color:var(--faint);margin-top:2px;line-height:1.45}
  .k-num{font-family:var(--mono);text-align:right;width:1%;white-space:nowrap;
         font-variant-numeric:tabular-nums;color:var(--dim)}
  /* Un chiffre sorti prime sur ce qu'on en attendait. Les deux variantes portent
     deux classes : .k-pub est declaree apres .up et .down et l'emporterait sinon
     a specificite egale, comme cela s'est deja produit sur la date de l'encart. */
  .k-pub{color:var(--ink);font-weight:600}
  .k-pub.up{color:var(--pos)} .k-pub.down{color:var(--neg)}
  /* Resultats d'entreprises, commentaires attribues : pas d'heure ni de chiffre,
     donc une ligne pleine largeur plutot qu'une ligne a quatre cellules vides. */
  .k-libre td{color:var(--dim)}

  @media (max-width:560px){
    table.cal{font-size:12px}
    .k-prec{display:none}      /* le precedent passe en infobulle sur mobile */
  }

  .fs-list{margin:0;padding-left:17px;list-style:none}
  .fs-list li{position:relative;margin-bottom:7px;line-height:1.6;color:var(--ink2)}
  .fs-list li:last-child{margin-bottom:0}
  .fs-list li::before{content:"▪";position:absolute;left:-15px;color:var(--faint)}
  .fs-lab{color:var(--ink);font-weight:650}

  .ctrl{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search],select{font:inherit;font-size:13.5px;color:var(--ink);
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
  input[type=search]{min-width:220px}

  /* Surlignage de recherche : en feuille de style et non en attribut style, pour
     qu'il suive le theme comme le reste. */
  mark{background:var(--mark-bg);color:var(--mark-ink);border-radius:2px}

  .empty{color:var(--faint);font-size:13.5px;font-style:italic}
  .err{background:var(--err-bg);border:1px solid var(--err-line);color:var(--err-ink);
       border-radius:8px;padding:13px 15px;font-size:13.5px}
  .note{background:var(--note-bg);border:1px solid var(--line);color:var(--dim);
        border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:22px}
  .note b{color:var(--ink2);font-weight:550}
  .note .badge{vertical-align:1px}
  .err code{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
         font-size:11.5px;color:var(--faint);line-height:1.8}
  footer b{color:var(--dim)}
  footer .badge{margin:0 2px}

  @media print{
    body{background:#fff;color:#000}
    .news{border-color:#bbb;background:#fff;break-inside:avoid}
    .fs{background:#fff;border-color:#ccc;break-inside:avoid}
    .fs-name,.fs-lab{color:#000} .fs-list li{color:#222}
    .c-name,.focus h3,.focus p{color:#000}
    .bul li{color:#222}
    table.board td,table.cal td{border-bottom-color:#ddd}
    table.board tr:hover td,table.cal tbody tr:hover td{background:none}
    .k-ev,.k-jour td{color:#222} .k-det,.k-num,.k-h{color:#555}
    .k-past td{opacity:1}     /* a l'impression, tout doit rester lisible */
    .c-tick{color:#333} .c-ccy,.c-date,footer{color:#666}
    section{break-inside:avoid}
    button,.ctrl,.meta a{display:none}
    .up{color:#0a6b3d} .down{color:#a01722}
  }
</style>
<script>
/* Theme applique avant le premier rendu. Ce bout de script est ici et non en fin
   de page pour une raison precise : un choix « clair » enregistre sur un systeme
   en sombre ferait sinon clignoter la page en sombre le temps du chargement. */
try{
  var m = localStorage.getItem("theme");
  if (m === "light" || m === "dark") document.documentElement.setAttribute("data-theme", m);
}catch(e){ /* localStorage refuse en navigation privee : on reste sur le systeme */ }
</script>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1><span class="tick">▍</span> Veille marchés</h1>
      <span class="refdate" id="refdate">chargement…</span>
    </div>
    <div class="meta">
      <span class="diag" id="diag"></span>
      <span id="gen"></span>
      <button id="theme" title="Bascule entre système, clair et sombre">Thème</button>
      <button id="print">Imprimer</button>
      <button id="copy" title="Copie une instruction à coller dans Claude Code">Copier pour Claude</button>
      <a id="runlink" href="#" target="_blank" rel="noopener" hidden
         title="Ouvre l'onglet Actions de GitHub, où le bouton Run workflow force une collecte immédiate">Forcer une collecte sur GitHub ↗</a>
    </div>
  </header>

  <div id="alert"></div>
  <div id="board"></div>

  <section>
    <div class="ghead"><h2>Brief du jour</h2><span id="briefdate" class="refdate"></span><div class="rule"></div></div>
    <div class="ctrl">
      <select id="pickdate"><option>—</option></select>
      <input type="search" id="q" placeholder="Rechercher dans tout l'historique…">
    </div>
    <div class="news" id="news"><span class="empty">chargement…</span></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
"use strict";

/* Lecture same-origin : le site est servi par GitHub Pages depuis le depot qui
   contient latest.json. Aucun CORS, aucune URL a configurer. Le parametre
   anti-cache reste utile car Pages met en cache quelques minutes. */
const bust = () => "?t=" + Date.now();
const getJSON = async (p) => {
  const r = await fetch(p + bust(), {cache: "no-store"});
  if (!r.ok) throw new Error(p + " → HTTP " + r.status);
  return r.json();
};

/* Regroupement d'affichage. Par famille et non par zone : on lit une bande
   marches par nature d'actif, alors que le brief presse se lit par zone. */
const GROUPS = [
  ["Actions",     ["S&P 500","Nasdaq 100","CAC 40","Euro Stoxx 50","Nikkei 225",
                   "Shanghai Comp.","KOSPI"]],
  ["Change",      ["EUR/USD"]],
  ["Taux",        ["10Y US","10Y France"]],
  ["Volatilité & sentiment", ["VIX","Fear & Greed crypto"]],
  ["Matières & crypto", ["Or","Brent","Bitcoin"]],
];

/* Convention francaise : les points de base s'ecrivent « pb ». */
const UNIT_SUFFIX = {pct:" %", bp:" pb", pts:" pt"};
const nf = (v, d) => v.toLocaleString("fr-FR",
  {minimumFractionDigits:d, maximumFractionDigits:d});

const cls = (v) => v == null ? "flat" : (v > 0 ? "up" : (v < 0 ? "down" : "flat"));

/* Le triangle porte le sens de la variation, donc le +/− devient redondant :
   on n'affiche que la magnitude. */
const ARROW = {up:"▲", down:"▼", flat:"–"};
function signed(v, unit){
  const d = unit === "pct" ? 2 : (unit === "bp" ? 1 : 2);
  return `<span class="tri">${ARROW[cls(v)]}</span>`
       + nf(Math.abs(v), d) + (UNIT_SUFFIX[unit] || "");
}
const frDate = (iso) => {
  const [y,m,d] = iso.split("-");
  return d + "/" + m + "/" + y;
};

function row(label, e){
  if (!e || e.error){
    return `<tr class="bad"><td class="c-tick">—</td><td class="c-name">${label}</td>
      <td class="c-ccy"></td><td class="c-lvl">indisponible</td>
      <td class="c-chg"></td><td class="c-date"></td></tr>`;
  }
  const unit = e.unit || "pct", chg = e.change;

  const badges = [];
  if (e.stale)   badges.push(`<span class="badge b-stale" title="${e.stale_reason||""}">périmé</span>`);
  if (e.suspect) badges.push(`<span class="badge b-susp" title="${e.suspect_reason||""}">suspect</span>`);

  /* Date du dernier cours, en ambre si elle n'est pas à jour. Sans elle, un
     chiffre de la semaine dernière se lit comme celui d'hier. */
  let date;
  if (e.on_target === null){
    /* Une moyenne mensuelle n'a pas de jour : afficher 01/06/2026 laisserait
       croire a une cotation du 1er juin. */
    const [yy, mm] = e.date.split("-");
    date = `<span class="stale-date" title="moyenne mensuelle">${mm}/${yy}</span>`;
  } else {
    const cls2 = e.on_target === false ? ' class="stale-date"' : "";
    date = `<span${cls2}>${frDate(e.date)}</span>`;
  }
  if ((e.change_days || 0) > 4 && e.on_target !== null)
    date = `<span class="stale-date" title="variation calculée depuis le ${e.change_from}">${frDate(e.date)} ⚠</span>`;

  /* Nature de la valeur, source et devise en infobulle : disponible sans
     encombrer la ligne. */
  const tip = [e.basis, e.source].filter(Boolean).join(" · ");

  return `<tr title="${tip}">
    <td class="c-tick">${e.ticker || "—"}</td>
    <td class="c-name">${label} ${badges.join("")}</td>
    <td class="c-ccy">${e.ccy || ""}</td>
    <td class="c-lvl">${nf(e.level, e.dec ?? 2)}</td>
    <td class="c-chg ${cls(chg)}">${chg != null ? signed(chg, unit) : "—"}</td>
    <td class="c-date">${date}</td>
  </tr>`;
}

function renderBoard(data){
  const m = data.markets || {};
  const d = data.diagnostics || {};
  const target = d.target_date || data.target_date || data.date;

  document.getElementById("refdate").textContent =
    "séance du " + new Date(target + "T00:00:00").toLocaleDateString("fr-FR",
      {weekday:"long", day:"numeric", month:"long", year:"numeric"});

  const bits = [`<b class="k-ok">${(d.aligned||[]).length}</b> sur la séance`];
  const off = d.off_target || [];
  if (off.length)
    bits.push(`<b class="k-warn">${off.length}</b> en retard de publication`);
  if ((d.errors||[]).length)  bits.push(`<b class="k-err">${d.errors.length}</b> erreurs`);
  if ((d.stale||[]).length)   bits.push(`<b class="k-warn">${d.stale.length}</b> périmés`);
  if ((d.suspect||[]).length) bits.push(`<b class="k-warn">${d.suspect.length}</b> suspects`);
  document.getElementById("diag").innerHTML = bits.join("  ·  ");

  /* Les instruments en retard sont nommés en clair. Aucune source gratuite ne
     publie leur séance du jour cible ; les masquer laisserait croire que tout
     le tableau porte la même date. */
  if (off.length){
    document.getElementById("alert").innerHTML = `<div class="note">
      Pas encore publiés pour le ${frDate(target)} — affichés à leur date réelle,
      repérables par le badge <span class="badge b-lag">J−n</span> :
      <b>${off.map(o => o[0]).join(", ")}</b>.</div>`;
  }

  /* Heure réelle du dernier relevé, dans le fuseau du lecteur — plus parlant
     qu'un âge relatif : « à 12:10 » se compare tout de suite à l'heure qu'il est,
     là où « il y a 2 h » demande un calcul. L'âge reste en infobulle, et sert de
     seuil d'alerte : au-delà de 36 h un jour ouvré, le pipeline n'a pas tourné. */
  if (data.generated_at){
    const gen = new Date(data.generated_at);
    const hours = (Date.now() - gen) / 36e5;
    const hhmm = gen.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
    const sameDay = gen.toDateString() === new Date().toDateString();
    const el = document.getElementById("gen");
    el.textContent = sameDay
      ? `relevé à ${hhmm}`
      : `relevé le ${frDate(gen.toISOString().slice(0,10))} à ${hhmm}`;
    el.title = hours < 1 ? "il y a moins d'une heure"
             : hours < 24 ? `il y a ${Math.round(hours)} h`
             : `il y a ${Math.round(hours / 24)} j`;
    el.className = hours > 36 ? "k-warn" : "";
  }

  const HEAD = `<thead><tr><th>Ticker</th><th>Nom</th><th>Dev.</th>
    <th class="r">Cours</th><th class="r">Var.</th><th class="r">Date</th></tr></thead>`;

  const seen = new Set();
  let html = "";
  for (const [title, labels] of GROUPS){
    const rows = labels.filter(l => l in m).map(l => (seen.add(l), row(l, m[l]))).join("");
    if (rows) html += `<section><div class="ghead"><h2>${title}</h2><div class="rule"></div></div>
      <table class="board">${HEAD}<tbody>${rows}</tbody></table></section>`;
  }
  const rest = Object.keys(m).filter(l => !seen.has(l));
  if (rest.length) html += `<section><div class="ghead"><h2>Autres</h2><div class="rule"></div></div>
    <table class="board">${HEAD}<tbody>${rest.map(l => row(l, m[l])).join("")}</tbody></table></section>`;

  document.getElementById("board").innerHTML = html;

  const notes = Object.entries(m).filter(([,e]) => e && e.note)
    .map(([l,e]) => `${l} — ${e.note}`);
  document.getElementById("foot").innerHTML =
    `<b>Légende</b> — <span class="badge b-stale">périmé</span> la source n'a pas publié depuis
     plusieurs jours. <span class="badge b-susp">suspect</span> variation hors
     bornes de plausibilité, ou sources divergentes. Date en ambre : le cours n'est
     pas celui de la dernière séance close. Survoler une ligne donne la nature
     exacte de la valeur et sa source.
     <br><br>
     Sources : Réserve fédérale de St. Louis (FRED), Banque centrale européenne,
     Banque de France, Kraken, alternative.me, Yahoo Finance. Relevé automatique
     en jours ouvrés à 5h00 UTC.
     ${notes.length ? "<br><br>" + notes.join("<br>") : ""}`;
}

/* ---------------------------------------------------------------- brief ---- */

/* Ordre repris du weekly interne : focus, puis macro, géopolitique, micro,
   actions, obligataire. L'ordre compte — c'est celui dans lequel le lecteur
   s'attend à trouver l'information. Les clés sont ordonnées, le rendu suit. */
const SECTIONS = {
  macro:       "Contexte macroéconomique",
  geo:         "Géopolitique",
  micro:       "Contexte microéconomique",
  actions:     "Marchés actions",
  obligations: "Marchés obligataires",
};
let briefCache = {};   // date -> brief
let briefIndex = [];

/* Encart FactSet Earnings Insight, en tete de la rubrique micro. Le document est
   hebdomadaire — publie le vendredi — donc repris a l'identique pendant toute la
   semaine suivante. D'ou la date « au JJ/MM/AAAA » affichee en clair : sans elle,
   un lecteur du jeudi prendrait pour frais des chiffres vieux de six jours. Elle
   passe en ambre au-dela de huit jours, comme les dates perimees du tableau : a
   ce stade le vendredi suivant est passe et le PDF n'a pas ete releve. */
function factsetHTML(fs, briefDate){
  if (!fs || !fs.as_of || !(fs.metrics || []).length) return "";
  const age = briefDate
    ? (new Date(briefDate + "T00:00:00") - new Date(fs.as_of + "T00:00:00")) / 864e5
    : 0;
  const late = age > 8 ? " stale-date" : "";
  /* value / detail : forme des premiers briefs, ou la metrique etait decoupee en
     colonnes. Recollees ici pour que l'historique reste lisible. */
  const rows = `<ul class="fs-list">` + fs.metrics.map(m =>
    `<li><b class="fs-lab">${m.label}</b> — ${
      m.text || [m.value, m.detail].filter(Boolean).join(" ")}</li>`).join("")
    + `</ul>`;
  return `<div class="fs">
    <div class="fs-head">
      <span class="fs-name">FactSet Earnings Insight</span>
      ${fs.quarter ? `<span class="fs-q">${fs.quarter} ·</span>` : ""}
      <span class="fs-as${late}" title="publication hebdomadaire du vendredi">au ${frDate(fs.as_of)}</span>
      ${fs.url ? `<a href="${fs.url}" target="_blank" rel="noopener"
                     title="Key Metrics, page 1 du rapport">PDF ↗</a>` : ""}
    </div>${rows}</div>`;
}

/* ---------------------------------------------------------------- drapeaux ---
   En SVG et non en emoji : les paires d'indicateurs regionaux (🇫🇷) ne sont pas
   rendues comme drapeaux sous Windows, faute de glyphes dans la police systeme —
   elles s'affichent en deux lettres. Un emoji aurait donc marche sur le telephone
   et pas sur le poste ou ce depot est tenu.

   Dessins volontairement grossiers : a seize pixels de large, une reproduction
   fidele ne se lit pas mieux qu'une silhouette de couleurs justes. Le contour
   reprend --line, sans quoi le drapeau japonais disparait sur fond clair. */
const FLAGS = (() => {
  const cadre = '<rect width="16" height="11" fill="none" stroke="var(--line)"' +
                ' stroke-width="1"/>';
  const svg = (inner) => '<svg class="k-flag" viewBox="0 0 16 11" role="img" ' +
                         'aria-hidden="true">' + inner + cadre + '</svg>';
  const bandesH = (couleurs) => couleurs.map((c, i) =>
    `<rect y="${(11 / couleurs.length * i).toFixed(2)}" width="16" ` +
    `height="${(11 / couleurs.length).toFixed(2)}" fill="${c}"/>`).join("");

  /* Douze etoiles de l'Union : douze points sur un cercle, chacun reduit a un
     disque. A cette taille une etoile a cinq branches devient un pate. */
  const etoilesUE = Array.from({length: 12}, (_, i) => {
    const a = (i * 30 - 90) * Math.PI / 180;
    return `<circle cx="${(8 + 3 * Math.cos(a)).toFixed(2)}" ` +
           `cy="${(5.5 + 3 * Math.sin(a)).toFixed(2)}" r=".55" fill="#FFCC00"/>`;
  }).join("");

  /* Treize bandes reduites a sept rouges sur fond blanc, plus le canton. */
  const bandesUS = Array.from({length: 7}, (_, i) =>
    `<rect y="${(i * 11 / 6.5).toFixed(2)}" width="16" height=".85" fill="#B31942"/>`).join("");

  return {
    US: svg('<rect width="16" height="11" fill="#fff"/>' + bandesUS +
            '<rect width="7" height="5.9" fill="#0A3161"/>' +
            '<circle cx="2" cy="1.6" r=".45" fill="#fff"/>' +
            '<circle cx="4.4" cy="1.6" r=".45" fill="#fff"/>' +
            '<circle cx="3.2" cy="3" r=".45" fill="#fff"/>' +
            '<circle cx="2" cy="4.4" r=".45" fill="#fff"/>' +
            '<circle cx="4.4" cy="4.4" r=".45" fill="#fff"/>'),
    EU: svg('<rect width="16" height="11" fill="#003399"/>' + etoilesUE),
    FR: svg('<rect width="16" height="11" fill="#fff"/>' +
            '<rect width="5.33" height="11" fill="#002395"/>' +
            '<rect x="10.67" width="5.33" height="11" fill="#ED2939"/>'),
    DE: svg(bandesH(['#000000', '#DD0000', '#FFCE00'])),
    UK: svg('<rect width="16" height="11" fill="#012169"/>' +
            '<path d="M0 0L16 11M16 0L0 11" stroke="#fff" stroke-width="2.4"/>' +
            '<path d="M0 0L16 11M16 0L0 11" stroke="#C8102E" stroke-width="1.1"/>' +
            '<path d="M8 0V11M0 5.5H16" stroke="#fff" stroke-width="3.6"/>' +
            '<path d="M8 0V11M0 5.5H16" stroke="#C8102E" stroke-width="2.1"/>'),
    CN: svg('<rect width="16" height="11" fill="#DE2910"/>' +
            '<circle cx="3.4" cy="3" r="1.35" fill="#FFDE00"/>' +
            '<circle cx="6.2" cy="1.5" r=".5" fill="#FFDE00"/>' +
            '<circle cx="7.4" cy="3.1" r=".5" fill="#FFDE00"/>' +
            '<circle cx="6.9" cy="5" r=".5" fill="#FFDE00"/>' +
            '<circle cx="5.3" cy="6.1" r=".5" fill="#FFDE00"/>'),
    JP: svg('<rect width="16" height="11" fill="#fff"/>' +
            '<circle cx="8" cy="5.5" r="3.2" fill="#BC002D"/>'),
    IN: svg(bandesH(['#FF9933', '#FFFFFF', '#138808']) +
            '<circle cx="8" cy="5.5" r="1.5" fill="none" stroke="#000080" ' +
            'stroke-width=".55"/>'),
  };
})();

const ZONE_NOM = {US: "États-Unis", EU: "zone euro", FR: "France", DE: "Allemagne",
                  UK: "Royaume-Uni", CN: "Chine", JP: "Japon", IN: "Inde"};

/* Calendrier prospectif de la semaine. Le reste du brief regarde derriere lui —
   une seance close, des faits acquis. Ce bloc regarde devant : ce qui tombe cette
   semaine et quel jour. C'est la seule partie du brief ou une date future est
   legitime, et rien n'y est chiffre autrement qu'en attendu de consensus, toujours
   attribue. */
function calendarHTML(cal, briefDate){
  const days = (cal && cal.days) || [];
  if (!days.length) return "";
  const today = briefDate || "";
  const jour = (iso) => new Date(iso + "T00:00:00")
    .toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});

  /* Une ligne de tableau par rendez-vous. `actual` n'existe qu'apres publication :
     le brief etant regenere chaque matin, la colonne se remplit d'elle-meme sans
     que la ligne change de place.

     Le champ `detail` porte les variantes regroupees d'un meme indicateur — le PCE
     en quatre declinaisons, l'enquete du Michigan en autant. Il passe sous le
     libelle, dans la meme cellule, pour ne pas casser l'alignement des colonnes. */
  /* Chiffre publie compare au consensus, convention du calendrier d'Investing :
     vert au-dessus, rouge en dessous. A lire « au-dessus du consensus » et NON
     « bonne nouvelle » — une inflation au-dessus des attentes ressort verte. D'ou
     l'infobulle, qui nomme la comparaison au lieu de la juger : le brief ne
     commente pas, ce tableau non plus. */
  const nombreFr = (s) => {
    if (typeof s !== "string") return null;
    const n = Number(s.replace(/[\s  ]/g, "")   // espaces, insecables comprises
                       .replace(/−/g, "-")           // signe moins typographique
                       .replace(/%/g, "").replace(/,/g, "."));
    return Number.isFinite(n) ? n : null;
  };

  const evt = (e, cls) => {
    if (typeof e === "string") e = {label: e};
    if (!e.time && !e.forecast && !e.previous && !e.actual)
      return `<tr class="k-libre${cls}"><td colspan="6">${e.label}</td></tr>`;

    const pub = nombreFr(e.actual), att = nombreFr(e.forecast);
    let ecart = "", bulle = "";
    if (pub !== null && att !== null){
      ecart = pub > att ? " up" : pub < att ? " down" : "";
      bulle = pub > att ? "au-dessus du consensus"
            : pub < att ? "en dessous du consensus" : "conforme au consensus";
    }
    return `<tr class="${cls.trim()}">
      <td class="k-h">${e.time || ""}</td>
      <td class="k-z" title="${ZONE_NOM[e.zone] || ""}">${
        (FLAGS[e.zone] || "") + (e.zone || "")}</td>
      <td class="k-ev">${e.label}${
        e.detail ? `<span class="k-det">${e.detail}</span>` : ""}</td>
      <td class="k-num k-pub${ecart}" title="${bulle}">${e.actual || ""}</td>
      <td class="k-num">${e.forecast || ""}</td>
      <td class="k-num k-prec" title="${e.previous ? "précédent " + e.previous : ""}">${
        e.previous || ""}</td>
    </tr>`;
  };

  const rows = days.map(d => {
    const cls = d.date === today ? " k-today"
              : (d.date < today ? " k-past" : "");
    /* Tri par heure, ici et non dans le brief : une journee se parcourt dans
       l'ordre ou elle se deroule, et le redacteur n'a pas a y veiller. Les entrees
       sans heure — resultats, commentaires attribues — ferment la journee dans
       l'ordre ou elles ont ete ecrites. */
    const items = [...(d.events || d.items || [])]
      .map((e, i) => [typeof e === "string" ? {label: e} : e, i])
      .sort(([a, ia], [b, ib]) =>
        (a.time ? 0 : 1) - (b.time ? 0 : 1)
        || String(a.time || "").localeCompare(String(b.time || ""))
        || ia - ib)
      .map(([e]) => e);
    return `<tr class="k-jour${cls}"><td colspan="6">${jour(d.date)}</td></tr>`
      + items.map(e => evt(e, cls)).join("");
  }).join("");

  const src = (cal.sources || []).filter(s => s.url);
  /* Une page de calendrier officiel est permanente : elle n'a pas de date de
     publication, et la signaler « non vérifiable » la ferait passer pour douteuse
     alors qu'elle fait autorité. */
  const srcLine = src.length
    ? `<div class="srcs">Sources : ` + src.map(s =>
        `<a href="${s.url}" target="_blank" rel="noopener" title="${
          s.kind === "reference" ? "calendrier officiel, page permanente"
          : s.published ? "publié le " + frDate(s.published)
                        : "date de publication non vérifiable"}">${
          s.source || "source"} ↗</a>`).join(" · ") + `</div>`
    : "";

  return `<div class="zone z-calendrier"><h3>Le calendrier de la semaine</h3>
    <table class="cal"><thead><tr>
      <th>Heure</th><th>Zone</th><th>Indicateur</th>
      <th class="r">Publié</th><th class="r">Attendu</th>
      <th class="r k-prec">Précédent</th>
    </tr></thead><tbody>${rows}</tbody></table>${srcLine}</div>`;
}

/* Rend un brief en chaine HTML. Separer la construction de l'ecriture dans le
   DOM permet a la recherche de concatener plusieurs briefs sans manipulation
   d'elements temporaires. */
function briefHTML(brief, highlight){
  if (!brief) return `<span class="empty">Aucun brief pour cette date.</span>`;

  const mark = (t) => {
    if (!highlight || !t) return t || "";
    const safe = highlight.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return t.replace(new RegExp("(" + safe + ")", "gi"), '<mark>$1</mark>');
  };

  /* Le focus ouvre le brief : un seul sujet, celui qui a dominé la séance. */
  let html = "";
  if (brief.focus && brief.focus.body){
    html += `<div class="focus">
      ${brief.focus.title ? `<h3>Le focus du jour — ${mark(brief.focus.title)}</h3>` : ""}
      <p>${mark(brief.focus.body)}</p></div>`;
  }

  /* Puces sans titre, comme dans le weekly : un paragraphe court par fait,
     suivi de sa source cliquable. */
  for (const [key, title] of Object.entries(SECTIONS)){
    const items = (brief.sections && brief.sections[key]) || [];
    /* L'encart FactSet ouvre la rubrique micro. Rendu ici et non dans la
       recherche : celle-ci ne garde que les puces contenant le terme cherche,
       un encart de saison de resultats y serait hors sujet. */
    const encart = key === "micro" ? factsetHTML(brief.factset, brief.date) : "";
    if (!items.length && !encart) continue;
    /* Les liens sont regroupes sous la rubrique plutot qu'accroches a chaque
       puce : le texte reste lisible d'un trait, et les sources sont dedoublonnees. */
    const seenSrc = new Map();
    for (const it of items) if (it.url && !seenSrc.has(it.url))
      seenSrc.set(it.url, {name: it.source || "source",
                           unv: !!it.date_unverified, pub: it.published});
    const srcLine = seenSrc.size
      ? `<div class="srcs">Sources : ` + [...seenSrc].map(([u, m]) =>
          `<a href="${u}" target="_blank" rel="noopener" title="${
            m.pub ? "publié le " + frDate(m.pub)
                  : "date de publication non vérifiable"}">${m.name}${
            m.unv ? " ⚠" : ""} ↗</a>`).join(" · ") + `</div>`
      : "";

    html += `<div class="zone z-${key}"><h3>${title}</h3>${encart}`
      + (items.length
          ? `<ul class="bul">`
            + items.map(it => `<li>${mark(it.text)}</li>`).join("")
            + `</ul>`
          : "")
      + `${srcLine}</div>`;
  }
  /* Ferme le brief : tout ce qui precede est acquis, ce qui suit est attendu. */
  if (!highlight) html += calendarHTML(brief.calendar, brief.date);
  return html || `<span class="empty">Brief vide.</span>`;
}

function renderBrief(brief, highlight){
  document.getElementById("news").innerHTML = briefHTML(brief, highlight);
}

async function loadBrief(date){
  if (briefCache[date]) return briefCache[date];
  try{
    const b = await getJSON(`news/brief-${date}.json`);
    briefCache[date] = b;
    return b;
  }catch{ return null; }
}

async function initBrief(){
  try{ briefIndex = (await getJSON("news/index.json")).dates || []; }
  catch{ briefIndex = []; }

  const sel = document.getElementById("pickdate");
  if (!briefIndex.length){
    sel.innerHTML = `<option>aucun brief</option>`;
    document.getElementById("news").innerHTML =
      `<span class="empty">Aucun brief publié pour l'instant. La tâche planifiée
       écrira news/brief-AAAA-MM-JJ.json et news/index.json.</span>`;
    return;
  }
  sel.innerHTML = briefIndex.map(d => `<option value="${d}">${frDate(d)}</option>`).join("");
  const show = async (d) => {
    const b = await loadBrief(d);
    renderBrief(b);
    /* Deux dates distinctes, et il faut les distinguer : le brief du lundi
       matin rattrape le week-end, alors que les cours affiches restent ceux de
       la seance de vendredi. Les confondre laisserait croire que le marche a
       cote pendant le week-end. */
    const el = document.getElementById("briefdate");
    el.textContent = b && b.session && b.session !== d
      ? `publié le ${frDate(d)} · cours de la séance du ${frDate(b.session)}`
      : (b ? `séance du ${frDate(d)}` : "");
  };
  await show(briefIndex[0]);
  sel.onchange = () => show(sel.value);
}

/* Recherche plein texte : charge les briefs a la demande et les garde en cache. */
async function search(term){
  if (!term){ renderBrief(await loadBrief(document.getElementById("pickdate").value)); return; }
  const hits = [];
  for (const d of briefIndex){
    const b = await loadBrief(d);
    if (!b) continue;
    const q = term.toLowerCase();
    if (!JSON.stringify(b).toLowerCase().includes(q)) continue;

    /* Ne garde que les puces qui contiennent le terme, et le focus s'il le
       contient : afficher le brief entier noierait le résultat. */
    const sections = {};
    for (const [key, items] of Object.entries(b.sections || {})){
      const keep = (items || []).filter(it => (it.text || "").toLowerCase().includes(q));
      if (keep.length) sections[key] = keep;
    }
    const focus = (b.focus && ((b.focus.title || "") + (b.focus.body || ""))
                    .toLowerCase().includes(q)) ? b.focus : null;
    if (focus || Object.keys(sections).length)
      hits.push({date: d, focus, sections});
  }
  const el = document.getElementById("news");
  if (!hits.length){
    el.innerHTML = `<span class="empty">Aucun résultat pour « ${term} ».</span>`;
    return;
  }
  el.innerHTML = hits.map(h => `
    <div style="margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)">
      <div style="font-family:var(--mono);font-size:11.5px;color:var(--accent);
                  margin-bottom:6px">${h.date}</div>
      ${briefHTML(h, term)}
    </div>`).join("");
}

/* ------------------------------------------------------------------ init --- */

/* Charge latest.json et le brief. Pas de bouton de rafraîchissement : F5 fait
   exactement la même chose, et une page statique ne peut de toute façon pas
   déclencher le pipeline sans embarquer un jeton, ce qui est exclu sur un dépôt
   public. Pour forcer un relevé, passer par Actions → Run workflow. */
async function load(){
  document.getElementById("alert").innerHTML = "";
  try{
    renderBoard(await getJSON("latest.json"));
  }catch(err){
    document.getElementById("refdate").textContent = "";
    document.getElementById("alert").innerHTML = `<div class="err">
      <b>Impossible de lire latest.json.</b><br>
      ${err.message}<br><br>
      Causes probables : le workflow n'a jamais tourné, ou GitHub Pages n'est pas
      encore activé sur la branche. Vérifier que <code>latest.json</code> existe
      bien à la racine du dépôt — un <code>git add history/</code> seul ne le
      pousse pas.</div>`;
  }
  briefCache = {};                     // vide le cache pour relire les briefs
  await initBrief();
}

/* ----------------------------------------------------------------- theme ---
   Trois etats et non deux : « systeme » suit le reglage du navigateur, les deux
   autres l'outrepassent. Le choix est donc explicite, alors qu'un simple
   interrupteur impose un defaut a qui n'y touche pas.

   Le theme retenu est ecrit dans localStorage, donc propre au navigateur — une
   page statique n'a nulle part ailleurs ou le mettre. En « systeme », l'attribut
   est retire et light-dark() se resout sur prefers-color-scheme. */
const THEMES = ["auto", "light", "dark"];
const THEME_LABEL = {auto: "Thème : système", light: "Thème : clair", dark: "Thème : sombre"};

function applyTheme(mode){
  const root = document.documentElement;
  if (mode === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", mode);
  const btn = document.getElementById("theme");
  if (btn) btn.textContent = THEME_LABEL[mode];
  try{ localStorage.setItem("theme", mode); }catch{ /* navigation privee */ }
}

function initTheme(){
  let mode = "auto";
  try{
    const saved = localStorage.getItem("theme");
    if (THEMES.includes(saved)) mode = saved;
  }catch{ /* localStorage indisponible : on reste en systeme */ }
  applyTheme(mode);
  document.getElementById("theme").onclick = () => {
    const actuel = document.documentElement.getAttribute("data-theme") || "auto";
    applyTheme(THEMES[(THEMES.indexOf(actuel) + 1) % THEMES.length]);
  };
}

(async function(){
  initTheme();
  document.getElementById("print").onclick = () => window.print();

  /* Bouton de copie : l'instruction ne contient AUCUN chemin personnel — cette
     page est publique, et un chemin de repertoire utilisateur y serait une fuite.
     Elle est donc relative au dossier du projet. */
  const btnCopy = document.getElementById("copy");
  btnCopy.onclick = async () => {
    const txt = "Depuis le dossier veille-marches : lis news/BRIEF_PROMPT.md "
              + "et génère le brief marchés du jour en suivant ses instructions, "
              + "puis commite et pousse.";
    try{
      await navigator.clipboard.writeText(txt);
      btnCopy.textContent = "Copié ✓";
    }catch{
      /* Le presse-papiers exige un contexte sécurisé : en local sur http il
         échoue. On affiche alors le texte pour qu'il reste copiable à la main. */
      window.prompt("Copier cette instruction :", txt);
    }
    setTimeout(() => { btnCopy.textContent = "Copier pour Claude"; }, 2000);
  };

  /* Déduit l'URL du dépôt depuis l'adresse GitHub Pages : compte.github.io/depot
     donne github.com/compte/depot/actions. Ce lien n'exécute rien lui-même — une
     page statique ne peut pas déclencher un workflow sans embarquer un jeton. Il
     ouvre seulement l'endroit où le bouton Run workflow se trouve. Masqué en
     local, faute de pouvoir deviner le dépôt. */
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (m){
    const repo = location.pathname.split("/").filter(Boolean)[0];
    if (repo){
      const a = document.getElementById("runlink");
      a.href = `https://github.com/${m[1]}/${repo}/actions`;
      a.hidden = false;
    }
  }

  await load();

  let timer;
  document.getElementById("q").addEventListener("input", (ev) => {
    clearTimeout(timer);
    const v = ev.target.value.trim();
    timer = setTimeout(() => search(v), 280);
  });
})();
</script>
